<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shipyard</title>
<style>
  :root { color-scheme: dark; --bg: #0b1218; --fg: #e8eef2; --panel: rgba(14, 22, 30, 0.9); --line: rgba(255,255,255,0.12);
    --red: #ff3b2f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .label { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-size: 12px;
    padding: 2px 8px; border-radius: 999px; background: var(--panel); border-left: 4px solid var(--c, #889); }
  .label.place { font-size: 13px; font-weight: 600; letter-spacing: .02em; border-left-color: #c9a227; border-radius: 4px; }
  .label.lead { font-weight: 600; }
  .label.lane { font-size: 10.5px; padding: 1px 6px; opacity: .9; }
  .label.off { opacity: .55; }
  .label.alert { background: var(--red); color: #fff; border-left-color: #fff; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { background: #8a120c; } }
  #needs { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 24px); }
  #needs button { font: inherit; font-weight: 700; color: #fff; background: var(--red); border: 2px solid #fff;
    border-radius: 999px; padding: 6px 14px 6px 10px; cursor: pointer; box-shadow: 0 0 0 0 rgba(255,59,47,.7);
    animation: pulse 1.2s infinite; }
  #needs .flag { margin-right: 6px; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 14px rgba(255,59,47,0); } 100% { box-shadow: 0 0 0 0 rgba(255,59,47,0); } }
  #conn { position: fixed; right: 12px; top: 12px; background: #7a1d16; padding: 4px 10px; border-radius: 6px; }
  #sheet { position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom));
    width: 320px; max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 14px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  #sheet .who { display: flex; gap: 10px; align-items: center; padding-right: 26px; }
  #sheet .who b { font-size: 16px; display: block; }
  #sheet small { opacity: .7; }
  .hat { width: 26px; height: 16px; border-radius: 13px 13px 3px 3px; background: var(--c); flex: none; }
  #close { position: absolute; right: 8px; top: 6px; background: none; border: 0; color: var(--fg); font-size: 24px;
    cursor: pointer; width: 36px; height: 36px; }
  #sheet { position: fixed; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 8px; }
  .chip { padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.08); font-size: 12.5px; }
  .chip i { font-style: normal; }
  .st-busy, .st-active { background: #1f5e33; } .st-waiting { background: var(--red); font-weight: 700; }
  .st-offline { background: #2c3a30; } .st-resting { background: #3b3a2a; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0 0 8px; font-size: 13px; }
  dt { opacity: .6; } dd { margin: 0; overflow-wrap: anywhere; }
  .crew { display: flex; flex-wrap: wrap; gap: 6px; }
  .crewman { font: inherit; font-size: 12px; color: var(--fg); background: rgba(255,255,255,.06); border: 0;
    border-left: 4px solid var(--c); border-radius: 6px; padding: 4px 8px; cursor: pointer; min-height: 30px; }
  .crewman i { font-style: normal; margin-right: 5px; }
  .crewman.off { opacity: .55; }
  @media (max-width: 700px) {
    #sheet { left: 0; right: 0; bottom: 0; width: auto; border-radius: 16px 16px 0 0; max-height: 46vh;
      padding-bottom: max(14px, env(safe-area-inset-bottom)); }
    #sheet::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line);
      margin: -6px auto 8px; }
    .label.lane { display: none; }
  }
</style>
</head>
<body>
<canvas id="view" tabindex="0" role="img" aria-label="Claude Code sessions as a shipyard: dry docks, foremen, welders"></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="needs" hidden aria-live="assertive"></div>
<div id="conn" hidden>feed unreachable</div>
<section id="sheet" hidden aria-live="polite"></section>
<script src="strata-loader.js"></script>
<script src="strata-kit.js"></script>
<script src="shipyard.js"></script>
</body>
</html>
